# =============================================================================
#  render.yaml — Infrastructure-as-Code for Render
#  Defines the web service + PostgreSQL database in one file.
#  Placed at repo root so Render Blueprints automatically detects it.
# =============================================================================

databases:
  - name: sms-db
    databaseName: sms_db
    user: sms_user
    plan: free           # Change to "starter" or higher for production

services:
  - type: web
    name: student-management-system
    runtime: python
    plan: free           # Change to "starter" or higher for production
    buildCommand: "./build.sh"
    startCommand: "gunicorn sms_project.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    rootDir: sms_project  # Django project directory containing manage.py & build.sh

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: sms_project.settings

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: "student-management-system-n48c.onrender.com,.onrender.com,localhost,127.0.0.1"

      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://student-management-system-n48c.onrender.com,https://*.onrender.com"

      # SSL / Security headers
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "True"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "True"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"

      # Automatically link the managed PostgreSQL database above
      - key: DATABASE_URL
        fromDatabase:
          name: sms-db
          property: connectionString

      # Secret values — set these in the Render dashboard (Environment tab)
      - key: DJANGO_SECRET_KEY
        sync: false      # Render will prompt you to fill this in the dashboard
