<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#00cec9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Glowing Mortarboard Icon -->
  <g transform="translate(0, -10)" filter="url(#glow)">
    <!-- Cap top (Diamond) -->
    <polygon points="256,120 420,195 256,270 92,195" fill="url(#accentGrad)"/>
    
    <!-- Cap base / skullcap -->
    <path d="M165,232 L165,305 C165,340 205,370 256,370 C307,370 347,340 347,305 L347,232 L256,274 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Tassel string -->
    <path d="M380,205 L380,310 C380,320 370,335 365,340" stroke="#00cec9" stroke-width="8" stroke-linecap="round" fill="none"/>
    
    <!-- Tassel knot and fringe -->
    <circle cx="380" cy="205" r="8" fill="#ffffff"/>
    <rect x="358" y="338" width="14" height="28" rx="4" fill="#00cec9"/>
  </g>

  <!-- Subtitle Text -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="#ffffff" text-anchor="middle">SMS</text>
</svg>
